# Local development services. The app runs on the host with `pnpm dev`.
#   docker compose -f docker-compose.dev.yml up -d                 # PostgreSQL
#   docker compose -f docker-compose.dev.yml --profile s3 up -d    # + local Garage (S3) for testing
# Garage setup for the local instance: docs/STORAGE.md → "Local test".
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: noclue
      POSTGRES_PASSWORD: noclue-dev
      POSTGRES_DB: noclue_industries
    ports:
      - '127.0.0.1:5433:5432' # loopback only
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U noclue -d noclue_industries']
      interval: 5s
      timeout: 3s
      retries: 10

  garage:
    profiles: ['s3']
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:3900:3900' # S3 API
      - '127.0.0.1:3902:3902' # public web endpoint
    volumes:
      - ./deploy/garage/garage.dev.toml:/etc/garage.toml:ro
      - garage-dev:/var/lib/garage

volumes:
  pgdata-dev:
  garage-dev:
